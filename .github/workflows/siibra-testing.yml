name: "[test] unit test"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SIIBRA_LOG_LEVEL: "INFO_WO_PROGRESS_BARS"

# A line "[ci:usecfg] <ref>" in the head commit message selects a ref of
# siibra-configurations to test with (see setup-custom-cfg).
jobs:
  lint:
    uses: ./.github/workflows/_lint.yaml
    with:
      os: ubuntu-latest
      python-version: "3.11"

  check-importable:
    uses: ./.github/workflows/_importable.yaml
    with:
      os: ${{ matrix.os || 'ubuntu-latest' }}
      python-version: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: &py-versions ["3.14", "3.13", "3.12", "3.11", "3.10", "3.9"]
        include: &py-os-overrides
          # Python 3.9 is not available on ubuntu-26.04 (ubuntu-latest)
          - python-version: &py-min "3.9"
            os: &py-min-os ubuntu-24.04

  unit-tests-full:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/_unittest.yaml
    with:
      os: ${{ matrix.os || 'ubuntu-latest' }}
      python-version: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: *py-versions
        include: *py-os-overrides
  unit-tests-fast:
    if: ${{ github.event.pull_request == null }}
    uses: ./.github/workflows/_unittest.yaml
    with:
      os: *py-min-os
      python-version: *py-min

  e2e-tests-full:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/_e2e.yaml
    with:
      os: ${{ matrix.os || 'ubuntu-latest' }}
      python-version: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: *py-versions
        include: *py-os-overrides

  e2e-tests-fast:
    if: ${{ github.event.pull_request == null }}
    uses: ./.github/workflows/_e2e.yaml
    with:
      os: *py-min-os
      python-version: *py-min

  test-examples:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/_run_examples.yaml
    with:
      os: self-hosted
      python-version: ">=3.11.18,<3.12"
