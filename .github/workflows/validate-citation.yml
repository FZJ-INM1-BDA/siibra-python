name: '[validation] validate citation file'

on:
  push:
    paths:
    - 'CITATION.cff'
    - 'codemeta.json'
    - 'siibra/VERSION'
    - 'scripts/release.py'
    - 'README.rst'
    - 'pyproject.toml'
  pull_request:
    paths:
    - 'CITATION.cff'
    - 'codemeta.json'
    - 'siibra/VERSION'
    - 'scripts/release.py'
    - 'README.rst'
    - 'pyproject.toml'
  # Called by the release workflow (pyblish-release-to-pypi.yml).
  workflow_call:

permissions:
  contents: read

jobs:
  validate_citation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Install cffconvert
      run: |
          pip install -U pip
          pip install cffconvert packaging

    - name: Validate CITATION.cff
      run: cffconvert --validate -i ./CITATION.cff

    # Checks VERSION, CITATION.cff and codemeta.json agree (version, dates,
    # download URL), that the README requirements match pyproject.toml, that the
    # siibra-configurations tag siibra-<version> exists, and, for releases,
    # that the release tag matches the version.
    - name: Check release metadata
      run: python scripts/release.py check