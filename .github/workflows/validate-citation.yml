name: '[validation] validate citation file'

on:
  push:
    paths:
    - 'CITATION.cff'
    - 'codemeta.json'
    - 'siibra/VERSION'
    - 'scripts/release.py'
    - 'README.rst'
    - 'setup.py'
  pull_request:
    paths:
    - 'CITATION.cff'
    - 'codemeta.json'
    - 'siibra/VERSION'
    - 'scripts/release.py'
    - 'README.rst'
    - 'setup.py'
  # Called by the release workflow (pyblish-release-to-pypi.yml).
  workflow_call:

permissions:
  contents: read

jobs:
  validate_citation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Set up Python 3.10
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.10'
    - name: Install cffconvert
      run: |
          pip install -U pip
          pip install cffconvert packaging

    - name: Validate CITATION.cff
      run: cffconvert --validate -i ./CITATION.cff

    # Checks VERSION, CITATION.cff and codemeta.json agree (version, dates,
    # download URL), that the README requirements match setup.py, that the
    # siibra-configurations tag siibra-<version> exists, and, for releases,
    # that the release tag matches the version.
    - name: Check release metadata
      run: python scripts/release.py check