name: "[Docs] Build docs and upload artifacts"

on:
  push:
    branches: ["main", "doc_*", "v1", "maint_*", "fix_*"]
  release:
    types: ["published"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  notebooks:
    name: Build and run the notebooks for the docs
    runs-on: self-hosted

    permissions:
      contents: read

    env:
      PYTHON_VERSION: ">=3.11.18,<3.12"
      JOB_DIR: ${{ github.workspace }}/.ci-docs-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Define job directories
        shell: bash
        run: |
          {
            echo "VIRTUAL_ENV=$JOB_DIR/venv"
            echo "SIIBRA_CACHEDIR=$JOB_DIR/siibra-cache"
            echo "UV_CACHE_DIR=$JOB_DIR/uv-cache"
            echo "UV_PYTHON_INSTALL_DIR=$JOB_DIR/python"
            echo "MPLCONFIGDIR=$JOB_DIR/matplotlib"
          } >> "$GITHUB_ENV"
          
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          version: ">=0.13.6"

      - name: Create virtual environment
        shell: bash
        run: |
          mkdir -p "$JOB_DIR" "$SIIBRA_CACHEDIR"
          uv venv "$VIRTUAL_ENV" --python "$PYTHON_VERSION"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          "$VIRTUAL_ENV/bin/python" --version

      - name: Install dependencies
        shell: bash
        run: |
          uv pip install \
            --python "$VIRTUAL_ENV/bin/python" \
            . \
            -r docs/requirements-doc.txt

      - name: Build the docs and execute the notebooks
        shell: bash
        run: |
          python -m sphinx docs docs/_build

      - name: Upload built docs artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sphinx-docs-built-in-github-${{ github.sha }}
          path: docs
          retention-days: 2

      - name: Clean up
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          rm -rf -- "$JOB_DIR"

          find "$GITHUB_WORKSPACE" \
            -mindepth 1 \
            -maxdepth 1 \
            -exec rm -rf -- {} +

  upload-to-rtd:
    name: Trigger RTD build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    needs: notebooks
    steps:
      - name: Trigger RTD build
        uses: dfm/rtds-action@e028de3bdec9ae8e4bda371425986df0fb6cc4bf # v1.1.0
        with:
          webhook_url: ${{ secrets.RTDS_WEBHOOK_URL }}
          webhook_token: ${{ secrets.RTDS_WEBHOOK_TOKEN }}
          commit_ref: ${{ github.ref }}
